<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mandarin Numbers Match</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    text-align:center;
    padding:15px;
    margin:0;
}

h1{
    margin-bottom:5px;
}

.lesson{
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.container{
    display:flex;
    justify-content:center;
    gap:20px;
    max-width:900px;
    margin:auto;
}

.column{
    flex:1;
}

.column h2{
    margin-bottom:15px;
}

.card{
    background:white;
    border-radius:24px;
    min-height:95px;
    margin-bottom:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    user-select:none;
}

.card.selected{
    background:#bfdbfe;
}

.card.matched{
    background:#4ade80;
    color:white;
}

#nextBtn{
    margin-top:25px;
    padding:18px 40px;
    border:none;
    border-radius:18px;
    font-size:24px;
    background:#2563eb;
    color:white;
    display:none;
    cursor:pointer;
}

@media(max-width:700px){

    .card{
        min-height:90px;
        font-size:34px;
    }

}

</style>
</head>

<body>

<h1>Mandarin Numbers Match</h1>

<div class="lesson" id="lessonTitle"></div>

<div class="container">

    <div class="column">
        <h2>Chinese</h2>
        <div id="chineseColumn"></div>
    </div>

    <div class="column">
        <h2>English</h2>
        <div id="englishColumn"></div>
    </div>

</div>

<button id="nextBtn">Next Lesson ➜</button>

<script>

const lessons = [

[
["一","1"],
["二","2"],
["三","3"],
["四","4"],
["五","5"]
],

[
["六","6"],
["七","7"],
["八","8"],
["九","9"],
["十","10"]
],

[
["十一","11"],
["十二","12"],
["十三","13"],
["十四","14"],
["十五","15"]
],

[
["二十","20"],
["三十","30"],
["四十","40"],
["五十","50"],
["六十","60"]
],

[
["七十","70"],
["八十","80"],
["九十","90"],
["一百","100"],
["二百","200"]
],

[
["三百","300"],
["四百","400"],
["五百","500"],
["六百","600"],
["七百","700"]
],

[
["八百","800"],
["九百","900"],
["一千","1000"],
["二十五","25"],
["七十五","75"]
]

];

let lessonIndex = 0;
let selectedChinese = null;
let selectedEnglish = null;
let matchesFound = 0;

function shuffle(array){
    return [...array].sort(()=>Math.random()-0.5);
}

function speakChinese(text){

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "zh-CN";
    speech.rate = 0.8;

    speechSynthesis.speak(speech);
}

function loadLesson(){

    matchesFound = 0;

    selectedChinese = null;
    selectedEnglish = null;

    document.getElementById("nextBtn").style.display="none";

    const lesson = lessons[lessonIndex];

    document.getElementById("lessonTitle").innerText =
        `Lesson ${lessonIndex+1} of ${lessons.length}`;

    const chineseColumn =
        document.getElementById("chineseColumn");

    const englishColumn =
        document.getElementById("englishColumn");

    chineseColumn.innerHTML="";
    englishColumn.innerHTML="";

    lesson.forEach(pair=>{

        const card =
            document.createElement("div");

        card.className="card";

        card.innerText=pair[0];

        card.onclick=()=>{

            speakChinese(pair[0]);

            document
            .querySelectorAll("#chineseColumn .card")
            .forEach(c=>c.classList.remove("selected"));

            card.classList.add("selected");

            selectedChinese={
                element:card,
                chinese:pair[0],
                english:pair[1]
            };

            checkMatch();
        };

        chineseColumn.appendChild(card);
    });

    shuffle(lesson).forEach(pair=>{

        const card =
            document.createElement("div");

        card.className="card";

        card.innerText=pair[1];

        card.onclick=()=>{

            document
            .querySelectorAll("#englishColumn .card")
            .forEach(c=>c.classList.remove("selected"));

            card.classList.add("selected");

            selectedEnglish={
                element:card,
                chinese:pair[0],
                english:pair[1]
            };

            checkMatch();
        };

        englishColumn.appendChild(card);
    });
}

function checkMatch(){

    if(!selectedChinese ||
       !selectedEnglish) return;

    if(
        selectedChinese.english ===
        selectedEnglish.english
    ){

        selectedChinese.element
            .classList.add("matched");

        selectedEnglish.element
            .classList.add("matched");

        selectedChinese.element.onclick=null;
        selectedEnglish.element.onclick=null;

        matchesFound++;

        if(matchesFound===5){

            document
            .getElementById("nextBtn")
            .style.display="inline-block";
        }

    }
    else{

        setTimeout(()=>{

            selectedChinese.element
                .classList.remove("selected");

            selectedEnglish.element
                .classList.remove("selected");

        },500);
    }

    selectedChinese=null;
    selectedEnglish=null;
}

document.getElementById("nextBtn")
.onclick=()=>{

    lessonIndex++;

    if(lessonIndex>=lessons.length){

        alert(
          "Amazing! You finished all lessons!"
        );

        lessonIndex=0;
    }

    loadLesson();
};

loadLesson();

</script>

</body>
</html>
